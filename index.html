<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0e14">
  <title>Julien and Calvin</title>
  <style>
    :root {
      --bg-base: #0b0e14;
      --bg-gradient: radial-gradient(circle at 50% 0%, #151c2c 0%, #0b0e14 70%);
      --card-bg: #131822;
      --card-hover: #19202e;
      --card-active: #1d2536;
      --border-subtle: #1f2736;
      --border-highlight: #3a4a6b;
      --text-primary: #e8ecf4;
      --accent-glow: rgba(99, 130, 196, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      background-image: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 1.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }

    a {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 76px;
      background-color: var(--card-bg);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.015em;
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.45);
      transition: transform 0.14s ease, background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    a:active {
      transform: scale(0.98);
      background-color: var(--card-active);
      border-color: var(--border-highlight);
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 520px;
        gap: 1.25rem;
      }
      a {
        min-height: 112px;
      }
      a:hover {
        background-color: var(--card-hover);
        border-color: var(--border-highlight);
        box-shadow: 0 8px 28px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--accent-glow);
        transform: translateY(-2px);
      }
    }
  </style>
</head>
<body>
  <main class="grid">
    <a href="https://www.ugift529.com/gifttpl/ugift/create/viewGiftCodeDetails.cs?ugiftcode=J2J-L3M" target="_blank">College Savings (Julien)</a>
    <a href="https://www.ugift529.com/gifttpl/ugift/create/viewGiftCodeDetails.cs?ugiftcode=Q42-J0E" target="_blank">College Savings (Calvin)</a>
    <a href="https://contribute.trumpaccount.com/juliend-70f3d9ed/?secret=8YaZnHrYM3NjLmGAmx6H1wr" target="_blank">Trump Account (Julien)</a>
    <a href="https://contribute.trumpaccount.com/calvind-cc64e207/?secret=8YaZnHrYM3NjLmGAmx6H1wr" target="_blank">Trump Account (Calvin)</a>
  </main>
</body>
</html>
