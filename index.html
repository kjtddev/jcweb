<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0d">
  <title>Start Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 1.25rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }
    a {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 76px;
      background-color: #171717;
      color: #f0f0f0;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      border-radius: 14px;
      border: 1px solid #262626;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    a:active {
      transform: scale(0.98);
      background-color: #222222;
      border-color: #404040;
    }
    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        max-width: 500px;
        gap: 1.25rem;
      }
      a {
        min-height: 110px;
      }
      a:hover {
        background-color: #202020;
        border-color: #444444;
        transform: translateY(-2px);
      }
    }
  </style>
</head>
<body>
  <main class="grid">
    <a href="https://www.ugift529.com/gifttpl/ugift/create/viewGiftCodeDetails.cs?ugiftcode=J2J-L3M">College Savings (Julien)</a>
    <a href="https://www.ugift529.com/gifttpl/ugift/create/viewGiftCodeDetails.cs?ugiftcode=Q42-J0E">College Savings (Calvin)</a>
    <a href="https://contribute.trumpaccount.com/juliend-70f3d9ed/?secret=8YaZnHrYM3NjLmGAmx6H1wr">Trump Account (Julien)</a>
    <a href="https://contribute.trumpaccount.com/calvind-cc64e207/?secret=8YaZnHrYM3NjLmGAmx6H1wr">Trump Account (Calvin)</a>
  </main>
</body>
</html>
